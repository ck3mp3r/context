[package]
name = "context-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
context-core = { path = "../context-core" }
context-sync = { path = "../context-sync" }
context-skills = { path = "../context-skills" }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["trace", "fs"] }
utoipa.workspace = true
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
rmcp = { version = "3.0.1", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
futures-util = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dashmap = "6"
serde.workspace = true
serde_json.workspace = true
miette.workspace = true
thiserror.workspace = true
mime_guess = { version = "2.0.5", optional = true }
rust-embed = { version = "8.11.0", features = ["axum", "compression", "include-exclude"], optional = true }
sha2 = "0.11.0"

[dev-dependencies]
serial_test = "4.0.1"
