[package]
name = "context-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "c5t"
path = "src/main.rs"

[dependencies]
context-server = { path = "../context-server" }
context-core = { path = "../context-core" }
context-db = { path = "../context-db" }
context-sync = { path = "../context-sync" }
context-skills = { path = "../context-skills" }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider", "query"] }
miette.workspace = true
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
webpki-root-certs = "1.0.7"
tokio = { version = "1.52.3", features = ["full"] }
tabled = { version = "0.21.0", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
context-sync = { path = "../context-sync", features = ["testing"] }
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "json", "chrono"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
tempfile = "3.27.0"
mockall = "0.15.0"
serial_test = "4.0.1"
base64 = "0.23.0"
sha2 = "0.11.0"
rmcp = { version = "3.1.2", features = ["server"] }
tokio-util = "0.7.18"
