[package]
name = "context-frontend"
version = "0.7.9"
edition = "2024"
license = "GPL-2.0"
authors = ["Christian Kemper"]

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
serde_json = "1.0.151"
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
gloo-storage = "0.4.0"
pulldown-cmark = "0.13.4"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.leptos]
version = "0.8.20"
features = ["csr"]

[dependencies.leptos-use]
version = "0.19.0"
features = ["use_websocket"]

[dependencies.thaw]
version = "0.5.0-beta"
features = ["csr"]

[dependencies.codee]
version = "0.3.5"
features = ["json_serde"]

[dependencies.gloo-net]
version = "0.7.0"
features = [
    "http",
    "json",
]

[dependencies.web-sys]
version = "0.3.104"
features = [
    "Window",
    "Document",
    "HtmlElement",
    "Location",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
]
