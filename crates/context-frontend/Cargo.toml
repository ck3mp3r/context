[package]
name = "context-frontend"
version = "0.8.0"
edition = "2024"
license = "GPL-2.0"
authors = ["Christian Kemper"]

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[features]
# The browser end-to-end harness. Off by default so the headless workspace
# build never pulls the Playwright driver into its dependency graph.
e2e = ["dep:playwright-rs"]

[dependencies]
serde_json = "1.0.154"
leptos_router = "0.8.17"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
gloo-storage = "0.4.0"
pulldown-cmark = "0.13.4"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.leptos]
version = "0.8.22"
features = ["csr"]

[dependencies.leptos-use]
version = "0.19.2"
features = ["use_websocket"]

[dependencies.thaw]
version = "0.5.0-beta"
features = ["csr"]

[dependencies.codee]
version = "0.3.5"
features = ["json_serde"]

[dependencies.gloo-net]
version = "0.7.0"
features = [
    "http",
    "json",
]

[dependencies.web-sys]
version = "0.3.106"
features = [
    "Window",
    "Document",
    "HtmlElement",
    "Location",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
]

# Optional, feature-gated: only the e2e harness links a browser driver.
# Cargo forbids optional dev-dependencies, so it lives here behind `e2e`.
# Default features are off: `native-tls` pulls openssl, which this repo does
# not build against, and the harness only talks to a local driver over stdio.
[dependencies.playwright-rs]
version = "0.21.1"
optional = true
default-features = false
features = ["ring"]

[dev-dependencies.tokio]
version = "1.47.1"
features = [
    "macros",
    "rt-multi-thread",
]

[[test]]
name = "e2e"
required-features = ["e2e"]

[[example]]
name = "install-browsers"
required-features = ["e2e"]

[lints.cargo]
# playwright-rs is only reachable from the feature-gated e2e targets, and an
# optional dependency is the only way to keep it out of the default graph.
unused_dependencies = "allow"
