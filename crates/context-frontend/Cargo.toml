[package]
name = "context-frontend"
version = "0.8.0"
edition = "2024"
license = "GPL-2.0"
authors = ["Christian Kemper"]

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[features]
# Marker for the browser end-to-end harness. playwright-rs arrives through
# dev-dependencies, which cargo compiles only for test and example targets;
# the e2e targets additionally carry `required-features = ["e2e"]`.
e2e = []

[dependencies]
serde_json = "1.0.154"
leptos_router = "0.8.17"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
gloo-storage = "0.4.0"
pulldown-cmark = "0.13.4"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.leptos]
version = "0.8.22"
features = ["csr"]

[dependencies.leptos-use]
version = "0.19.2"
features = ["use_websocket"]

[dependencies.thaw]
version = "0.5.0-beta"
features = ["csr"]

[dependencies.codee]
version = "0.3.5"
features = ["json_serde"]

[dependencies.gloo-net]
version = "0.7.0"
features = [
    "http",
    "json",
]

[dependencies.web-sys]
version = "0.3.106"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "NodeList",
    "Event",
    "KeyboardEvent",
    "Location",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
]

[dev-dependencies.tokio]
version = "1.47.1"
features = [
    "macros",
    "rt-multi-thread",
]

# Only the e2e test and the browser installer use this. Dev-dependencies are
# exempt from the cargo `unused_dependencies` lint, and a plain lib build does
# not compile them. Default features are off: `native-tls` pulls openssl,
# which this repo does not build against, and the harness only talks to a
# local driver over stdio.
[dev-dependencies.playwright-rs]
version = "0.21.1"
default-features = false
features = ["ring"]

[[test]]
name = "e2e"
required-features = ["e2e"]

[[example]]
name = "install-browsers"
required-features = ["e2e"]
