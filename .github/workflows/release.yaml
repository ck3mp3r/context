name: Release

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      base_version: ${{ steps.prep.outputs.base_version }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      suffix: ${{ steps.prep.outputs.suffix }}
      branch: ${{ steps.prep.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main
        with:
          nu-mods-ref: feature/port-nu-tools-to-ci

      - name: Prepare release
        id: prep
        shell: nu {0}
        run: |
          use ci *

          "github-actions[bot]@users.noreply.github.com" | ci scm config

          # Create placeholder dist/ folder for rust-embed compile-time check
          # The real frontend build happens later in the build job
          mkdir crates/context-server/dist
          echo '<!DOCTYPE html><html><body>Placeholder for rust-embed</body></html>' | save crates/context-server/dist/index.html

          # A release run from a non-main branch is always a pre-release.
          # Use the short SHA as the suffix so it never collides with the real
          # release line and is distinguishable from other pre-releases.
          let prerelease = if "${{ github.ref_name }}" == "main" { "false" } else { "true" }
          let suffix = if $prerelease == "true" { (git rev-parse --short HEAD | str trim) } else { "" }

          let current_version = (open Cargo.toml).workspace.package.version
          let latest_tag = (ci scm latest-tag)
          # Pre-releases keep the current version (no semver bump) and append the
          # suffix; full releases bump the patch from the latest tag.
          let base_version = if $prerelease == "true" {
            $current_version
          } else {
            (ci scm semver $latest_tag $current_version)
          }
          let version = if $prerelease == "true" { $"($base_version)-($suffix)" } else { $base_version }

          # Release branch name: release/<version> for full, release/<version>-<sha> for pre-release
          let branch = $"release/($version)"

          # Create and push the release branch (from the run branch)
          $version | ci scm branch --release --version $version --from "${{ github.ref_name }}" --push
          # Update workspace package version and refresh Cargo.lock
          let files = (ci cargo update-version $version)
          $files | ci scm commit -m $"Prepare release ($version)" --push
          # save --append over a list writes each line with a trailing newline
          [
            $"version=($version)"
            $"base_version=($base_version)"
            $"prerelease=($prerelease)"
            $"suffix=($suffix)"
            $"branch=($branch)"
          ] | save --append $env.GITHUB_OUTPUT

  build:
    needs: prep-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nix_system: x86_64-linux
            docker_arch: amd64
          - os: macos-15
            nix_system: x86_64-darwin
            docker_arch: na
          - os: macos-15
            nix_system: aarch64-darwin
            docker_arch: na
          - os: ubuntu-24.04-arm
            nix_system: aarch64-linux
            docker_arch: arm64
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.branch }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          github-token: ${{github.token}}

      - name: Build archive for ${{ matrix.nix_system }}
        run: nix build .#archive --print-build-logs

      - name: Copy build outputs for uniqueness
        run: |
          # Archive package creates generic filenames, so we rename them with system suffix
          cp result/context-cli.tgz ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.tgz
          cp result/context-cli.sha256 ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.sha256
          cp result/context-cli-nix.sha256 ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}-nix.sha256

      - name: Upload build outputs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: context-assets-${{ matrix.nix_system }}
          path: |
            ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.tgz
            ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.sha256
            ${{ github.workspace }}/context-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}-nix.sha256

      - name: Log in to GHCR
        uses: docker/login-action@v4
        if: ${{ matrix.docker_arch != 'na' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.nix_system }} container
        if: ${{ matrix.docker_arch != 'na' }}
        run: |
          VERSION=${{ needs.prep-release.outputs.version }}
          nix build .#container --system ${{ matrix.nix_system }} && cat result | docker load

          docker tag context:${VERSION} ghcr.io/${{ github.repository_owner }}/context:${VERSION}-${{ matrix.docker_arch }}
          docker push ghcr.io/${{ github.repository_owner }}/context:${VERSION}-${{ matrix.docker_arch }}

  finalize-release:
    needs:
      - prep-release
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT }}

      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main
        with:
          nu-mods-ref: feature/port-nu-tools-to-ci

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Finalize release
        shell: nu {0}
        run: |
          use ci *

          "github-actions[bot]@users.noreply.github.com" | ci scm config

          let version = "${{ needs.prep-release.outputs.version }}"
          let base_version = "${{ needs.prep-release.outputs.base_version }}"
          let prerelease = "${{ needs.prep-release.outputs.prerelease }}"
          let suffix = "${{ needs.prep-release.outputs.suffix }}"
          let branch = "${{ needs.prep-release.outputs.branch }}"
          # version already carries the suffix for pre-releases
          let release_tag = $"v($version)"

          # Generate platform data and commit (finalize already checked out the release branch)
          let data_files = (ci artifacts platform-data $version "./artifacts" "context" --tag $release_tag)
          $data_files | ci scm commit -m $"Add platform data for release ($version)" --push

          # Prepare architecture data with hashes
          let architectures = [
            {
              name: "aarch64-darwin"
              hash: (open $"./artifacts/context-assets-aarch64-darwin/context-($version)-aarch64-darwin.sha256" | str trim)
            }
            {
              name: "aarch64-linux"
              hash: (open $"./artifacts/context-assets-aarch64-linux/context-($version)-aarch64-linux.sha256" | str trim)
            }
            {
              name: "x86_64-darwin"
              hash: (open $"./artifacts/context-assets-x86_64-darwin/context-($version)-x86_64-darwin.sha256" | str trim)
            }
            {
              name: "x86_64-linux"
              hash: (open $"./artifacts/context-assets-x86_64-linux/context-($version)-x86_64-linux.sha256" | str trim)
            }
          ]

          # Update Homebrew formula
          open Formula/context.rb | ci homebrew update-formula $version "context" $architectures | save --force Formula/context.rb

          # Commit the formula update
          ["Formula/context.rb"] | ci scm commit -m $"Update Homebrew formula for ($version)" --push

          if $prerelease != "true" {
            # Merge release branch to main and clean up (idempotent on re-run)
            ci scm merge $branch -m $"Release ($version)" --push --delete-remote
          }

          # Create release and upload artifacts using gh CLI
          if $prerelease == "true" {
            ci github release create $base_version --prerelease --suffix $suffix --target $branch
          } else {
            ci github release create $version
          }
          glob "./artifacts/**/*.*" | ci github release upload $release_tag

        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION=${{ needs.prep-release.outputs.version }}
          REPO=ghcr.io/${{ github.repository_owner }}/context

          # Pull architecture-specific images
          docker pull $REPO:$VERSION-amd64
          docker pull $REPO:$VERSION-arm64

          # Create versioned multi-arch manifest
          docker manifest create $REPO:$VERSION \
            $REPO:$VERSION-amd64 \
            $REPO:$VERSION-arm64
          docker manifest push $REPO:$VERSION

          docker manifest create $REPO:latest --amend \
            $REPO:$VERSION-amd64 \
            $REPO:$VERSION-arm64
          docker manifest push $REPO:latest
