---
name: CI Build & Cache
on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "crates/**"
  pull_request:
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "crates/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          github-token: ${{github.token}}
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            substituters = https://cache.nixos.org https://ck3mp3r.cachix.org
            extra-trusted-public-keys = ck3mp3r.cachix.org-1:wKbNJDH7mrT9DuVvG1KRRtqfcy0FREVGguU7RIfL5zo=

      - name: Build and test
        run: nix develop .#ci --command cargo nextest run

  nix-build-cache:
    name: Nix build & cache
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for git diff

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          github-token: ${{github.token}}
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            substituters = https://cache.nixos.org https://ck3mp3r.cachix.org
            extra-trusted-public-keys = ck3mp3r.cachix.org-1:wKbNJDH7mrT9DuVvG1KRRtqfcy0FREVGguU7RIfL5zo=

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main
        with:
          nu-mods-ref: ci-publish-redesign-test

      - name: Build, test, and cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: nu {0}
        run: |
          use ci *

          # Build the package
          let results = ("." | ci nix build context)

          let failed = ($results | where status != 'success')
          if ($failed | length) > 0 {
            print '❌ Build failed'
            exit 1
          }

          let store_path = ($results | where status == 'success' | first | get path)

          # Determine if we should push to cache (only on main)
          let should_cache = ($env.GITHUB_REF == 'refs/heads/main')

          if $should_cache {
            print '✓ Pushing closure to ck3mp3r.cachix.org...'
            let pub = ($results | ci nix publish 'https://ck3mp3r.cachix.org')

            let total_paths = ($pub | length)
            let pushed_count = ($pub | where status == uploaded | length)
            let summary = [
              $"## 🏗️ Build & Cache Summary"
              ""
              $"**Store path:** ($store_path)"
              ""
              $"**Total paths:** ($total_paths)  **Pushed:** ($pushed_count)"
            ]
            $summary | ci github summary
          } else {
            print 'ℹ️ Branch push — skipping cache push'
            let pub = ($results | ci nix publish 'https://ck3mp3r.cachix.org' --dry-run)

            let summary = [
              $"## 🏗️ Build Summary"
              ""
              $"**Store path:** ($store_path)"
              ""
              "Cache push skipped (not main branch)."
            ]
            $summary | ci github summary
          }