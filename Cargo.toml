[[bin]]
name = "c5t"
path = "src/bin/cli.rs"
required-features = ["backend"]

[package]
name = "context"
version = "0.7.8"
edition = "2024"
license = "GPL-2.0"
authors = ["Christian Kemper"]

[lib]
path = "src/lib.rs"

[features]
default = ["backend"]
backend = [
    "dep:axum",
    "dep:chrono",
    "dep:clap",
    "dep:dashmap",
    "dep:futures-util",
    "dep:miette",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:sqlx",
    "dep:tabled",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:utoipa",
    "dep:utoipa-axum",
    "dep:utoipa-scalar",
    "dep:webpki-root-certs",
]

[dependencies]
context-core = { path = "crates/context-core" }
base64 = "0.23.0"
ignore = "0.4"
sanitize-filename = "0.6"
serde_json = "1.0.150"
serde_yaml = "0.9"
sha2 = "0.11.0"
strip-ansi-escapes = "0.2"
tempfile = "3.27.0"
thiserror = "2.0.18"

[dependencies.dashmap]
version = "6"
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.axum]
version = "0.8.9"
features = ["ws"]
optional = true

[dependencies.chrono]
version = "0.4.44"
optional = true

[dependencies.clap]
version = "4.6.1"
features = ["derive"]
optional = true

[dependencies.miette]
version = "7.6.0"
features = ["fancy"]
optional = true

[dependencies.mime_guess]
version = "2.0.5"
optional = true

[dependencies.reqwest]
version = "0.13.3"
default-features = false
features = [
    "json",
    "rustls-no-provider",
    "query",
]
optional = true

[dependencies.rust-embed]
version = "8.11.0"
features = [
    "axum",
    "compression",
    "include-exclude",
]
optional = true

[dependencies.rustls]
version = "0.23.40"
default-features = false
features = [
    "ring",
    "std",
    "tls12",
]
optional = true

[dependencies.rustls-platform-verifier]
version = "0.7.0"
optional = true

[dependencies.webpki-root-certs]
version = "1.0.7"
optional = true

[dependencies.rmcp]
version = "2.2.0"
features = [
    "server",
    "transport-streamable-http-server",
]
optional = true

[dependencies.sqlx]
version = "0.9.0"
features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "json",
    "chrono",
]
optional = true

[dependencies.tabled]
version = "0.21.0"
features = ["derive"]
optional = true

[dependencies.tokio]
version = "1.52.3"
features = ["full"]
optional = true

[dependencies.tokio-util]
version = "0.7.18"
optional = true

[dependencies.futures-util]
version = "0.3.32"
optional = true

[dependencies.tower-http]
version = "0.7.0"
features = [
    "trace",
    "fs",
]
optional = true

[dependencies.tracing]
version = "0.1.44"
optional = true

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]
optional = true

[dependencies.utoipa]
version = "5.5.0"
features = ["axum_extras"]
optional = true

[dependencies.utoipa-axum]
version = "0.2.0"
optional = true

[dependencies.utoipa-scalar]
version = "0.3.0"
features = ["axum"]
optional = true

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.3"
mockall = "0.15.0"
serial_test = "4.0.1"

[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
