[workspace]
resolver = "3"
members = [
    "crates/context-cli",
    "crates/context-core",
    "crates/context-db",
    "crates/context-server",
    "crates/context-skills",
    "crates/context-sync",
]
exclude = ["crates/context-frontend"]

[workspace.package]
version = "0.7.8-b118f3a"
edition = "2024"
license = "GPL-2.0"
authors = ["Christian Kemper"]

[workspace.dependencies]
serde_json = "1.0.150"
thiserror = "2.0.18"
chrono = "0.4.44"

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[workspace.dependencies.miette]
version = "7.6.0"
features = ["fancy"]

[workspace.dependencies.utoipa]
version = "5.5.0"
features = ["axum_extras"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
