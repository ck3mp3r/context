[build]
target = "crates/context-frontend/src/public/index.html"
dist = "crates/context-server/dist"
public_url = "/"
filehash = true
minify = "on_release"
# Disable wasm-opt - cargo already optimizes WASM with opt-level="z"
wasm_opt = "off"
# Use separate target directory to avoid lock contention with outer cargo build
target_dir = "target/trunk"
offline = true

[watch]
watch = ["crates/context-frontend/src"]
ignore = ["target", "crates/context-server/dist"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = true
no_autoreload = false

[[hooks]]
stage = "pre_build"
command = "tailwindcss"
command_arguments = ["-c", "./crates/context-frontend/src/tailwind/config.js", "-i", "./crates/context-frontend/src/tailwind/input.css", "-o", "./crates/context-frontend/src/public/style.css"]

[[proxy]]
backend = "http://localhost:3738"
rewrite = "/dev"

[[proxy]]
backend = "ws://localhost:3738/ws"
rewrite = "/dev/ws"
ws = true
