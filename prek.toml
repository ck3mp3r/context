default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", files = { glob = "*.{rs,toml,yml,yaml,md,json}" }, stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt"
files = "\\.rs$"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "sh -c 'case \"$(uname -s)\" in Darwin) cargo clippy --all-targets ;; *) cargo clippy --all-targets --workspace --exclude context ;; esac'"
files = "\\.rs$"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "tests"
name = "cargo nextest"
language = "system"
entry = "sh -c 'case \"$(uname -s)\" in Darwin) cargo nextest run --workspace --profile ci ;; *) cargo nextest run --workspace --profile ci --exclude context ;; esac'"
stages = ["pre-push"]
pass_filenames = false